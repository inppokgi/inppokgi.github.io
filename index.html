/* 레이아웃: 도트 게임 UI. 왼쪽 아이콘 열, 오른쪽 위젯 열, 가운데 창 영역, 아래 작업표시줄.
   그라데이션 없이 단색 면과 2px 계단형 외곽선, 번짐 없는 하드 그림자만 쓴다.
   색: Air Force Blue = 바탕, Pale Sky = 창·버튼 면, Baby Blue = 눌림·비활성, Ink Black = 글자·외곽선, Brick Ember = 강조. 단일 룩이라 다크 변형 없음. */
:root{
  --ember:#BA1200; --ink:#031927; --air:#508AA8; --baby:#9DD1F1; --pale:#C8E0F4;
  --desk:var(--air); --face:var(--pale); --win:#ffffff; --soft:#E9F3FB;
  --fg:var(--ink); --muted:#3A647D; --line:#508AA8; --link:#1F5F80; --bar:var(--pale);
  --hi:#ffffff; --sh:#508AA8;
  --pxo:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);
  --pxe:0 -2px 0 0 var(--ember),0 2px 0 0 var(--ember),-2px 0 0 0 var(--ember),2px 0 0 0 var(--ember);
  --pxo1:0 -1px 0 0 var(--ink),0 1px 0 0 var(--ink),-1px 0 0 0 var(--ink),1px 0 0 0 var(--ink);
  --btn:var(--pxo),inset 0 2px 0 0 var(--hi),inset 0 -2px 0 0 var(--sh);
  --btn-dn:var(--pxo),inset 0 2px 0 0 var(--sh);
  --field:var(--pxo),inset 0 2px 0 0 var(--pale);
  --drop:4px 4px 0 0 rgba(3,25,39,.35);
  --sans:"DotUni","Unifont","Galmuri11","DotGothic16","Malgun Gothic",monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--desk);color:var(--fg);font:16px/20px var(--sans);font-synthesis:none;-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed;overflow:hidden}
*{box-sizing:border-box}
::selection{background:var(--ink);color:#fff}
a{color:var(--link)}
b{font-weight:400;color:var(--ember)}
h3,h4{font-weight:400}

/* 기본 버튼 */
button{font:inherit;color:var(--fg);background:var(--face);border:0;border-radius:0;padding:4px 12px;min-height:28px;box-shadow:var(--btn);cursor:pointer}
button:not(:disabled):active{box-shadow:var(--btn-dn);transform:translateY(2px)}
button:disabled{color:var(--air);cursor:default}
button:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
input[type=file]{font:inherit;max-width:100%}
input[type=file]::file-selector-button{font:inherit;color:var(--fg);background:var(--face);border:0;padding:4px 12px;margin:4px 12px 4px 4px;box-shadow:var(--btn);cursor:pointer}
input[type=range]{accent-color:var(--ember)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:16px;height:16px;margin:3px 8px 3px 3px;padding:0;vertical-align:middle;background:var(--win);box-shadow:var(--pxo);cursor:pointer}
input[type=checkbox]:checked{background:var(--win) var(--sp-check) center/10px 10px no-repeat}

/* 스크롤바 */
::-webkit-scrollbar{width:20px;height:20px}
::-webkit-scrollbar-track{background:var(--sp-dither);background-size:4px 4px}
::-webkit-scrollbar-thumb{background:var(--face);border:2px solid var(--ink)}
::-webkit-scrollbar-thumb:hover{background:var(--baby)}
::-webkit-scrollbar-button{display:none}
::-webkit-scrollbar-corner{background:var(--face)}

/* 도트 아이콘 (16x16 원본, 화면에서는 정수 배율) */
.ti{display:inline-block;flex:none;width:16px;height:16px;background-size:16px 16px;background-repeat:no-repeat;background-position:center;image-rendering:pixelated}
.ic-world{background-image:var(--sp-world)}
.ic-chars{background-image:var(--sp-chars)}
.ic-works{background-image:var(--sp-works)}
.ic-memo{background-image:var(--sp-memo)}
.ic-settings{background-image:var(--sp-settings)}
.ic-trash{background-image:var(--sp-trash)}

#desktop{position:relative;height:calc(100% - 40px);overflow:hidden}
#icons{position:absolute;left:16px;top:16px;display:flex;flex-direction:column;gap:14px}
.icon{width:88px;min-height:0;background:none;box-shadow:none;padding:4px 2px;color:#fff;text-align:center;
  text-shadow:1px 0 0 var(--ink),-1px 0 0 var(--ink),0 1px 0 var(--ink),0 -1px 0 var(--ink),1px 1px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.icon:not(:disabled):active{box-shadow:none;transform:none}
.icon .sq{width:64px;height:64px;margin:0 auto 6px;background-color:var(--face);background-size:48px 48px;background-position:center;background-repeat:no-repeat;image-rendering:pixelated;box-shadow:var(--btn)}
.icon:hover .sq{box-shadow:var(--pxe),inset 0 2px 0 0 var(--hi),inset 0 -2px 0 0 var(--sh)}
.icon:focus-visible{background:var(--ink);outline:2px dotted #fff;outline-offset:-4px}

/* 위젯: 바탕화면 위의 작은 창 */
#widgets{position:absolute;right:12px;top:12px;width:272px;display:flex;flex-direction:column;gap:16px;max-height:calc(100% - 24px);overflow:auto;padding:6px 10px 10px 6px}
.box{background:var(--face);box-shadow:var(--pxo),var(--drop);padding:4px 4px 12px}
.box>*:not(h4){margin-left:6px;margin-right:6px}
.box h4{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:2px 8px;font-size:16px;color:#fff;background:var(--ink)}
.box h4::before{content:"";flex:none;width:9px;height:9px;background:var(--baby);-webkit-mask:var(--gl-spark) center/9px 9px no-repeat;mask:var(--gl-spark) center/9px 9px no-repeat}
.big{font-size:32px;line-height:36px;font-variant-numeric:tabular-nums}
#wDday .big{color:var(--ember)}
.row{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}

/* 창 */
#windows{position:absolute;inset:0;pointer-events:none}
.win{position:absolute;background:var(--face);box-shadow:var(--pxo),var(--drop);padding:4px;display:flex;flex-direction:column;gap:6px;pointer-events:auto;min-width:280px;min-height:160px;max-width:100%}
.win.max{inset:0!important;width:auto!important;height:auto!important;box-shadow:none}
.win.min{display:none}
.tbar{display:flex;align-items:center;gap:8px;height:30px;padding:3px 4px 3px 8px;background:var(--ink);color:#fff;cursor:move;touch-action:none;user-select:none}
.win.inactive .tbar{background:var(--baby);color:var(--ink)}
.tbar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar button{flex:none;width:24px;min-width:24px;height:22px;min-height:22px;padding:0;display:flex;align-items:center;justify-content:center;font-size:0}
.tbar button+button{margin-left:4px}
.tbar button::before{content:"";width:10px;height:10px;background:currentColor;-webkit-mask:var(--g) center/10px 10px no-repeat;mask:var(--g) center/10px 10px no-repeat}
.tbar button{color:var(--ink)}
.tbar button[data-w="min"]{--g:var(--gl-min)}
.tbar button[data-w="max"]{--g:var(--gl-max)}
.tbar button[data-w="close"]{--g:var(--gl-close)}
.tbar button[data-w="close"]:hover{background:var(--ember);color:#fff}
.wbody{flex:1;min-height:0;overflow:auto;padding:12px;background:var(--face);box-shadow:var(--pxo);scrollbar-gutter:stable}
.rs{position:absolute;touch-action:none}
.rs.r{right:-4px;top:0;bottom:0;width:8px;cursor:ew-resize}
.rs.b{bottom:-4px;left:0;right:0;height:8px;cursor:ns-resize}
.rs.c{right:-6px;bottom:-6px;width:16px;height:16px;cursor:nwse-resize;z-index:2}

/* 작업표시줄 */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:40px;display:flex;gap:10px;align-items:center;padding:4px 10px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));background:var(--face);border-top:2px solid var(--ink)}
#startBtn{display:flex;align-items:center;gap:8px}
#startBtn::before{content:"";width:18px;height:18px;background:var(--ember);-webkit-mask:var(--gl-spark) center/18px 18px no-repeat;mask:var(--gl-spark) center/18px 18px no-repeat}
#tasks{flex:1;min-width:0;display:flex;gap:10px;overflow:hidden;padding:4px;margin:-4px 0}
#tasks button{display:flex;align-items:center;gap:8px;max-width:160px;overflow:hidden;white-space:nowrap}
#tasks button .ti{margin:0}
#tasks button.on{box-shadow:var(--btn-dn);background:var(--baby)}
#saveSt{padding:0 6px;white-space:nowrap;font-size:16px}
#clock{padding:4px 10px;background:var(--win);box-shadow:var(--field);font-variant-numeric:tabular-nums}

/* 창 안쪽 공통 부품 */
.panel{background:var(--win);box-shadow:var(--field);padding:10px 12px;margin-bottom:16px}
.panel>h3,.sec>h3{margin:0 0 8px;font-size:16px;color:var(--ember)}
.muted{color:var(--muted)}
.cur{color:var(--ember)}
.grid{display:grid;gap:16px}
.cards{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));align-items:start}
.cards.works{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.cw{display:flex;flex-direction:column;gap:8px;min-width:0}
.mv{display:flex;gap:10px;justify-content:center}
.mv button{min-height:24px;padding:0 12px}
.card{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;background:var(--win);padding:6px;cursor:pointer;text-align:center;box-shadow:var(--pxo)}
.card:not(:disabled):active{box-shadow:var(--pxo);transform:none}
.card:hover{box-shadow:var(--pxe)}
.card .pic{overflow:hidden;aspect-ratio:1/1.7;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.card .nm{padding:4px;margin-top:6px;word-break:break-all;height:52px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.card[data-act]:hover .nm{background:var(--ink);color:#fff}
.field{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px 10px;align-items:start;margin-bottom:10px}
.field>label{color:var(--muted);padding-top:6px}
input[type=text],input[type=date],input[type=number],textarea,select{font:inherit;color:var(--fg);background:var(--win);border:0;border-radius:0;padding:4px 8px;min-height:28px;box-shadow:var(--field);max-width:100%;min-width:0}
select{appearance:none;-webkit-appearance:none;padding-right:30px;background:var(--win) var(--sp-arrow) right 10px center/14px 8px no-repeat;cursor:pointer}
input[type=text],textarea{width:100%}
textarea{min-height:72px;resize:vertical}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tabs button.on{box-shadow:var(--btn-dn);background:var(--baby)}
.item{background:var(--win);box-shadow:var(--pxo);padding:8px 10px;margin-bottom:12px}
.item .row{margin-bottom:6px}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:4px 4px 12px;cursor:grab;user-select:none}
.hscroll>.item{flex:0 0 240px;margin:0}
.hscroll textarea{user-select:text}
.crumb{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--air)}
.tag{display:inline-block;background:var(--win);box-shadow:var(--pxo1);padding:0 8px;margin:2px 8px 4px 1px}
.tl{border-left:4px solid var(--air);padding-left:12px;margin:0 0 10px 4px}
.tl .ev{margin-bottom:8px}

/* 스티커(바탕화면)와 보관함 메모 */
.sticky{position:absolute;width:200px;background:var(--face);box-shadow:var(--pxo),var(--drop);padding:4px;pointer-events:auto;z-index:5}
.sticky .sh,.note .sh{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 4px 2px 8px;color:#fff;cursor:move;touch-action:none;user-select:none}
.sticky .sh{background:var(--ember)}
.sticky .sh button,.note .sh button{min-height:22px;padding:0 8px}
.sticky textarea{min-height:100px;resize:both;width:100%;display:block;margin-top:6px}
#stickies{position:absolute;inset:0;pointer-events:none}
.canvas{position:relative;height:340px;overflow:auto;background-color:var(--soft);background-image:var(--sp-dots);background-size:16px 16px;box-shadow:var(--field)}
.canvas .inner{position:relative;width:1600px;height:1200px}
.canvas svg{position:absolute;left:0;top:0;pointer-events:none}
.note{position:absolute;width:190px;background:var(--face);box-shadow:var(--pxo),var(--drop);padding:4px}
.note .sh{background:var(--ink)}
.note textarea{min-height:72px;display:block;margin-top:6px}
.note.pick{outline:2px dashed var(--ember);outline-offset:4px}

/* 이미지 자르기 창 */
.cropov{position:fixed;inset:0;z-index:100000;background:rgba(3,25,39,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.cropbox{background:var(--face);color:var(--fg);box-shadow:var(--pxo),var(--drop);padding:14px;max-width:100%;max-height:100%;overflow:auto}
.cropbox canvas{display:block;margin:0 auto;touch-action:none;cursor:grab;background:var(--soft);box-shadow:var(--field)}

@media (max-width:640px){
  #widgets{width:200px}
  .icon{width:76px}.icon .sq{width:52px;height:52px;background-size:48px 48px}
  .field{grid-template-columns:1fr}
  #saveSt{display:none}
  .tbar{height:34px}
  .tbar button{width:30px;min-width:30px;height:26px;min-height:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<div id="desktop">
  <div id="icons">
    <button class="icon" data-open="world"><div class="sq ic-world"></div>세계관</button>
    <button class="icon" data-open="chars"><div class="sq ic-chars"></div>캐릭터</button>
    <button class="icon" data-open="works"><div class="sq ic-works"></div>작품</button>
    <button class="icon" data-open="memo"><div class="sq ic-memo"></div>메모</button>
    <button class="icon" data-open="settings"><div class="sq ic-settings"></div>설정</button>
    <button class="icon" data-open="trash"><div class="sq ic-trash"></div>휴지통</button>
  </div>
  <div id="widgets">
    <div class="box" id="wDday"></div>
    <div class="box" id="wTodo"></div>
    <div class="box" id="wPomo"></div>
  </div>
  <div id="stickies"></div>
  <div id="windows"></div>
</div>
<div id="taskbar">
  <button id="startBtn" type="button">시작</button>
  <div id="tasks"></div>
  <div id="clock"></div>
</div>
<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const now=()=>Date.now();
const KEY='uvstudio.v1';
const H72=72*3600*1000;
const APPS={};
const wins={};
let zTop=10, focusId=null;

/* ---------- 데이터 ---------- */
function blankWorld(kind,name){
  return {id:uid(),kind:kind,name:name||'새 세계관',version:'',desc:'',
    concepts:[],timelines:[{id:uid(),name:'메인 시간선',forkOf:'',events:[]}],
    episodes:[],related:[],workIds:[],memo:'',
    charFields:[],filterDefs:{gender:['여','남','기타'],affiliation:[],category:[]}};
}
function fresh(){
  const root=blankWorld('root','최상위 유니버스');
  return {v:1,savedAt:0,worlds:[root],chars:[],works:[],memos:{items:[],links:[]},todos:[],trash:[],
    settings:{dday:'2025-10-30',ddayLabel:'기념일',pomoWork:25,pomoBreak:5,pomoDone:0,sortChars:'manual',sortWorks:'manual'}};
}
function migrate(o){
  const f=fresh();
  o=o||{};
  const r=Object.assign({},f,o);
  r.settings=Object.assign({},f.settings,o.settings||{});
  r.memos=Object.assign({},f.memos,o.memos||{});
  if(!Array.isArray(r.worlds)||!r.worlds.some(w=>w.kind==='root')) r.worlds=[blankWorld('root','최상위 유니버스')].concat(r.worlds||[]);
  return r;
}
function loadLocal(){
  try{const j=localStorage.getItem(KEY); if(j) return migrate(JSON.parse(j));}catch(e){}
  return fresh();
}
let S=loadLocal();

/* ---------- 저장 ---------- */
const stEl=document.createElement('div');
stEl.id='saveSt'; stEl.className='muted'; 
$('#taskbar').insertBefore(stEl,$('#clock'));
function setSt(t){stEl.textContent=t;}
let dbDoc=null,saveTimer=null,dbBusy=false,dbDirty=false;
function save(){
  S.savedAt=now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  setSt(dbDoc?'저장 중':'저장됨 (이 브라우저)');
  if(dbDoc){dbDirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flushDb,800);}
}
async function flushDb(){
  if(!dbDoc||!dbDirty) return;
  if(dbBusy){saveTimer=setTimeout(flushDb,400);return;}
  dbBusy=true;dbDirty=false;
  try{await dbDoc.set({json:JSON.stringify(S),savedAt:S.savedAt});setSt('저장됨');}
  catch(e){setSt('저장됨 (이 브라우저만)');}
  dbBusy=false;
  if(dbDirty) saveTimer=setTimeout(flushDb,800);
}
async function initDb(){
  try{
    const c=window.claude; if(!c||!c.use) return;
    const user=await c.use('user'); const db=await c.use('db');
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbDoc=db.collection('data/users/'+id).doc('state');
    const snap=await dbDoc.get();
    if(snap.exists){
      const d=snap.data();
      if(d&&d.json&&(d.savedAt||0)>(S.savedAt||0)){
        S=migrate(JSON.parse(d.json));
        try{localStorage.setItem(KEY,d.json);}catch(e){}
        refreshAll(); setSt('저장됨'); return;
      }
    }
    if(S.savedAt){dbDirty=true;flushDb();} else setSt('저장됨');
  }catch(e){dbDoc=null;}
}

/* ---------- 휴지통 ---------- */
function trashIt(kind,label,payload,ctx){
  S.trash.unshift({id:uid(),kind:kind,label:label||'(이름 없음)',payload:payload,ctx:ctx||null,at:now()});
}
function purge(){
  const t=now(),n=S.trash.length;
  S.trash=S.trash.filter(x=>t-x.at<H72);
  if(S.trash.length!==n){save();refreshWin('trash');}
}
function restoreTrash(id){
  const i=S.trash.findIndex(x=>x.id===id); if(i<0) return;
  const x=S.trash[i], p=x.payload;
  if(x.kind==='world') S.worlds.push(p);
  else if(x.kind==='char') S.chars.push(p);
  else if(x.kind==='work') S.works.push(p);
  else if(x.kind==='memo') S.memos.items.push(p);
  else if(x.kind==='todo') S.todos.push(p);
  else if(x.kind==='sub'){
    const w=S.worlds.find(w=>w.id===x.ctx.wid);
    if(!w) return;
    if(x.ctx.tlid){
      const tl=w.timelines.find(t=>t.id===x.ctx.tlid);
      if(!tl) return;
      tl.events.push(p);
    }else w[x.ctx.key].push(p);
  }
  S.trash.splice(i,1);
  save(); refreshAll();
}

/* ---------- 창 관리 ---------- */
function makeDrag(handle,el,opt){
  handle.addEventListener('pointerdown',e=>{
    if(e.target.closest('button,input,textarea,select')) return;
    if(opt.block&&opt.block()) return;
    e.preventDefault();
    const sx=e.clientX,sy=e.clientY,ox=el.offsetLeft,oy=el.offsetTop;
    handle.setPointerCapture(e.pointerId);
    const mv=ev=>{
      let x=ox+ev.clientX-sx,y=oy+ev.clientY-sy;
      const c=opt.clamp(x,y); x=c[0];y=c[1];
      el.style.left=x+'px';el.style.top=y+'px';
    };
    const up=()=>{
      handle.removeEventListener('pointermove',mv);
      handle.removeEventListener('pointerup',up);
      handle.removeEventListener('pointercancel',up);
      if(opt.end) opt.end(el.offsetLeft,el.offsetTop);
    };
    handle.addEventListener('pointermove',mv);
    handle.addEventListener('pointerup',up);
    handle.addEventListener('pointercancel',up);
  });
}
function makeResize(el){
  $$('.rs',el).forEach(h=>{
    h.addEventListener('pointerdown',e=>{
      if(el.classList.contains('max')) return;
      e.preventDefault();
      const mode=h.classList.contains('c')?'c':h.classList.contains('r')?'r':'b';
      const sx=e.clientX,sy=e.clientY,sw=el.offsetWidth,sh=el.offsetHeight;
      h.setPointerCapture(e.pointerId);
      const mv=ev=>{
        if(mode!=='b') el.style.width=Math.max(240,sw+ev.clientX-sx)+'px';
        if(mode!=='r') el.style.height=Math.max(140,sh+ev.clientY-sy)+'px';
      };
      const up=()=>{
        h.removeEventListener('pointermove',mv);
        h.removeEventListener('pointerup',up);
        h.removeEventListener('pointercancel',up);
      };
      h.addEventListener('pointermove',mv);
      h.addEventListener('pointerup',up);
      h.addEventListener('pointercancel',up);
    });
  });
}
function focusWin(id){
  const w=wins[id]; if(!w) return;
  w.el.style.zIndex=++zTop; focusId=id;
  Object.keys(wins).forEach(k=>wins[k].el.classList.toggle('inactive',k!==id));
  renderTasks();
}
function renderTasks(){
  $('#tasks').innerHTML=Object.keys(wins).map(id=>{
    const w=wins[id];
    return '<button type="button" data-tk="'+id+'" class="'+(focusId===id&&!w.min?'on':'')+'"><i class="ti ic-'+id+'"></i>'+esc(APPS[id].title)+'</button>';
  }).join('');
}
function closeWin(id){
  const w=wins[id]; if(!w) return;
  w.el.remove(); delete wins[id];
  if(focusId===id) focusId=null;
  renderTasks();
}
function rerender(id){
  const w=wins[id]; if(!w) return;
  const st=w.body.scrollTop;
  APPS[id].render(w.body,w);
  w.body.scrollTop=st;
}
function refreshWin(id){ if(wins[id]) rerender(id); }
function refreshAll(){
  renderWidgets(); renderStickies();
  Object.keys(wins).forEach(rerender);
}
function openApp(id){
  const A=APPS[id]; if(!A) return;
  let w=wins[id];
  if(w){
    if(w.min){w.min=false;w.el.classList.remove('min');}
    focusWin(id); return;
  }
  const dk=$('#desktop'),DW=dk.clientWidth,DH=dk.clientHeight;
  const n=Object.keys(wins).length, narrow=DW<640;
  const left=narrow?8:Math.min(110+n*28,Math.max(8,DW-300));
  const top=Math.min((narrow?8:16)+n*24,Math.max(8,DH-200));
  const width=Math.max(260,Math.min(A.w,DW-left-8));
  const height=Math.max(180,Math.min(A.h,DH-top-8));
  const el=document.createElement('div');
  el.className='win';
  el.style.cssText='left:'+left+'px;top:'+top+'px;width:'+width+'px;height:'+height+'px;z-index:'+(++zTop);
  el.innerHTML='<div class="tbar"><i class="ti ic-'+id+'"></i><span class="t">'+esc(A.title)+'</span>'+
    '<button type="button" data-w="min" aria-label="최소화"></button>'+
    '<button type="button" data-w="max" aria-label="최대화"></button>'+
    '<button type="button" data-w="close" aria-label="닫기"></button></div>'+
    '<div class="wbody"></div><div class="rs r"></div><div class="rs b"></div><div class="rs c"></div>';
  $('#windows').appendChild(el);
  w=wins[id]={id:id,el:el,body:$('.wbody',el),ui:{},min:false};
  el.addEventListener('pointerdown',()=>focusWin(id),true);
  el.addEventListener('click',e=>{
    const b=e.target.closest('[data-w]'); if(!b) return;
    const k=b.dataset.w;
    if(k==='close') closeWin(id);
    else if(k==='max') el.classList.toggle('max');
    else if(k==='min'){w.min=true;el.classList.add('min');if(focusId===id)focusId=null;renderTasks();}
  });
  w.body.addEventListener('click',e=>{
    const t=e.target.closest('[data-act]');
    if(t&&A.click) A.click(t.dataset.act,t,w,e);
  });
  w.body.addEventListener('change',e=>{ if(A.change) A.change(e.target,w,e); });
  w.body.addEventListener('keydown',e=>{ if(A.key) A.key(e,w); });
  makeDrag($('.tbar',el),el,{
    block:()=>el.classList.contains('max'),
    clamp:(x,y)=>[Math.min(Math.max(x,-el.offsetWidth+80),dk.clientWidth-80),Math.min(Math.max(y,0),dk.clientHeight-30)]
  });
  makeResize(el);
  A.render(w.body,w);
  focusWin(id);
}
$('#icons').addEventListener('click',e=>{const b=e.target.closest('[data-open]'); if(b) openApp(b.dataset.open);});
$('#tasks').addEventListener('click',e=>{
  const b=e.target.closest('[data-tk]'); if(!b) return;
  const id=b.dataset.tk,w=wins[id]; if(!w) return;
  if(w.min){w.min=false;w.el.classList.remove('min');focusWin(id);}
  else if(focusId===id){w.min=true;w.el.classList.add('min');focusId=null;renderTasks();}
  else focusWin(id);
});
$('#startBtn').addEventListener('click',()=>openApp('settings'));

/* ---------- 시계 ---------- */
function tickClock(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  $('#clock').textContent=p(d.getHours())+':'+p(d.getMinutes());
}

/* ---------- 위젯: 디데이 ---------- */
function ymd(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function fmtDate(d){return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');}
function renderDday(){
  const el=$('#wDday'),st=S.settings,d=ymd(st.dday);
  if(!d){el.innerHTML='<h4>디데이</h4><div class="muted">설정에서 날짜를 정해 주세요</div>';return;}
  const t=new Date(),t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const diff=Math.round((t0-d)/864e5);
  let html='<h4>'+esc(st.ddayLabel||'디데이')+' · '+fmtDate(d)+'</h4>';
  if(diff<0){
    html+='<div class="big">D-'+Math.abs(diff)+'</div>';
  }else{
    let y=t0.getFullYear()-d.getFullYear();
    const ann=new Date(d.getFullYear()+y,d.getMonth(),d.getDate());
    if(ann>t0) y--;
    const next=new Date(d.getFullYear()+y+1,d.getMonth(),d.getDate());
    const left=Math.round((next-t0)/864e5);
    const today=new Date(d.getFullYear()+y,d.getMonth(),d.getDate()).getTime()===t0.getTime()&&y>0;
    html+='<div class="big">D+'+diff+'</div>';
    html+='<div>'+(today?'오늘 '+y+'주년!':(y+1)+'주년까지 D-'+left)+'</div>';
    html+='<div class="muted">현재 '+y+'주년 지남</div>';
  }
  el.innerHTML=html;
}

const imgSrc=v=>!v?'':(String(v).startsWith('data:')?v:'/_blob/'+v);
const imgTag=v=>'<img src="'+esc(imgSrc(v))+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block">';
function blobToData(b){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res('');r.readAsDataURL(b);});}
async function storeImage(blob){
  try{
    const c=window.claude,a=c&&c.use?await c.use('assets'):null;
    if(a){const r=await a.upload(blob);if(r&&r.id) return r.id;}
  }catch(e){}

function cropImage(file,opt,cb){
  const url=URL.createObjectURL(file),im=new Image();
  im.onerror=()=>{URL.revokeObjectURL(url);cb(null);};
  im.onload=()=>{
    const choices=opt.choices||null;
    let aspect=opt.aspect,z=1,W,H,minS,s,ox,oy;
    const ov=document.createElement('div');
    ov.className='cropov';
    ov.innerHTML='<div class="cropbox" role="dialog" aria-label="이미지 자르기"><canvas id="crc"></canvas>'+
      '<div class="row" style="margin-top:8px"><label for="crz">확대</label><input type="range" id="crz" min="1" max="4" step="0.01" value="1" class="grow"></div>'+
      (choices?'<div class="row" style="margin-top:6px"><label for="cra">비율</label><select id="cra">'+choices.map(c=>'<option value="'+c[0]+'">'+c[1]+'</option>').join('')+'</select></div>':'')+
      '<div class="muted" style="margin:6px 0">이미지를 끌어서 위치를 맞춰요</div>'+
      '<div class="row"><button type="button" id="cro">적용</button><button type="button" id="crx">취소</button></div></div>';
    document.body.appendChild(ov);
    const cv=$('#crc',ov),ctx=cv.getContext('2d');
    const clamp=()=>{ox=Math.min(0,Math.max(W-im.width*s,ox));oy=Math.min(0,Math.max(H-im.height*s,oy));};
    const draw=()=>{ctx.clearRect(0,0,W,H);ctx.drawImage(im,ox,oy,im.width*s,im.height*s);};
    function layout(){
      const maxH=Math.min(360,Math.max(160,window.innerHeight-260)),maxW=Math.min(300,window.innerWidth-80);
      H=maxH;W=H*aspect; if(W>maxW){W=maxW;H=W/aspect;}
      W=Math.round(W);H=Math.round(H);
      cv.width=W;cv.height=H;cv.style.width=W+'px';cv.style.height=H+'px';
      minS=Math.max(W/im.width,H/im.height); s=minS*z;
      ox=(W-im.width*s)/2; oy=(H-im.height*s)/2; clamp(); draw();
    }
    function close(res,asp){
      document.removeEventListener('keydown',onKey);
      ov.remove(); URL.revokeObjectURL(url); cb(res,asp);
    }
    const onKey=e=>{if(e.key==='Escape') close(null);};
    document.addEventListener('keydown',onKey);
    $('#crz',ov).addEventListener('input',e=>{
      z=parseFloat(e.target.value);
      const cx=(W/2-ox)/s,cy=(H/2-oy)/s;
      s=minS*z; ox=W/2-cx*s; oy=H/2-cy*s; clamp(); draw();
    });
    const sel=$('#cra',ov);
    if(sel) sel.addEventListener('change',()=>{aspect=parseFloat(sel.value);z=1;$('#crz',ov).value=1;layout();});
    cv.addEventListener('pointerdown',e=>{
      e.preventDefault(); cv.setPointerCapture(e.pointerId);
      let lx=e.clientX,ly=e.clientY;
      const mv=ev=>{ox+=ev.clientX-lx;oy+=ev.clientY-ly;lx=ev.clientX;ly=ev.clientY;clamp();draw();};
      const up=()=>{cv.removeEventListener('pointermove',mv);cv.removeEventListener('pointerup',up);cv.removeEventListener('pointercancel',up);};
      cv.addEventListener('pointermove',mv);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
    });
    $('#crx',ov).addEventListener('click',()=>close(null));
    $('#cro',ov).addEventListener('click',()=>{
      const k=Math.min(680/H,1/s),ow=Math.max(1,Math.round(W*k)),oh=Math.max(1,Math.round(H*k));
      const out=document.createElement('canvas'); out.width=ow; out.height=oh;
      out.getContext('2d').drawImage(im,-ox/s,-oy/s,W/s,H/s,0,0,ow,oh);
      out.toBlob(b=>close(b,aspect),'image/jpeg',0.88);
    });
    layout();
    $('#cro',ov).focus();
  };
  im.src=url;
}

function sortedBy(list,mode,nameFn){
  if(mode==='asc') return list.slice().sort((a,b)=>collator.compare(nameFn(a),nameFn(b)));

function swapIn(arr,a,b){const i=arr.indexOf(a),j=arr.indexOf(b); if(i<0||j<0) return; arr[i]=b; arr[j]=a;}
const SORTS=[['manual','직접 순서'],['asc','이름 오름차순 ▲'],['desc','이름 내림차순 ▼']];

const mvBtns=(act,id,idx,n,extra,vert)=>'<div class="mv"><button type="button" data-act="'+act+'" data-d="-1" data-i="'+id+'"'+(extra||'')+' aria-label="앞으로"'+(idx===0?' disabled':'')+'>'+(vert?'▲':'◀')+'</button>'+
  '<button type="button" data-act="'+act+'" data-d="1" data-i="'+id+'"'+(extra||'')+' aria-label="뒤로"'+(idx===n-1?' disabled':'')+'>'+(vert?'▼':'▶')+'</button></div>';
function kidsOf(p){return S.worlds.filter(x=>x.id!==p.id&&(x.related.some(r=>r.id===p.id&&r.type==='상위')||p.related.some(r=>r.id===x.id&&r.type==='파생')));}
function reachSet(){const root=S.worlds.find(x=>x.kind==='root'),seen=new Set(),q=[root];while(q.length){const n=q.shift();if(!n||seen.has(n.id))continue;seen.add(n.id);kidsOf(n).forEach(k=>q.push(k));}return seen;}
function orphanTops(){
  const r=reachSet(),orph=S.worlds.filter(x=>!r.has(x.id));
  return orph.filter(x=>!orph.some(o=>o!==x&&kidsOf(o).includes(x)));
}
function worldTree(cur){
  const root=S.worlds.find(x=>x.kind==='root'),seen=new Set();let h='';
  const row=(wd,depth,grp,parentId,idx)=>
    '<div class="item" style="margin-left:'+Math.min(depth,8)*16+'px"><div class="row"><span class="grow'+(wd.id===cur.id?' cur':'')+'">'+esc(wd.name)+' <span class="muted">'+KIND[wd.kind]+(wd.version?' · '+esc(wd.version):'')+'</span></span>'+
    (grp&&grp.length>1?mvBtns('mvWorld',wd.id,idx,grp.length,' data-p="'+esc(parentId)+'"',true):'')+
    '<button type="button" data-act="open" data-i="'+wd.id+'">열기</button></div></div>';
  const walk=(wd,depth,grp,parentId,idx)=>{
    if(seen.has(wd.id)) return; seen.add(wd.id);
    h+=row(wd,depth,grp,parentId,idx);
    const ks=kidsOf(wd); ks.forEach((k,i)=>walk(k,depth+1,ks,wd.id,i));
  };
  walk(root,0,null,'',0);
  const tops=orphanTops();
  if(tops.length){h+='<div class="muted" style="margin:8px 0 4px">상위 세계관이 연결되지 않은 세계관</div>';tops.forEach((k,i)=>walk(k,0,tops,'',i));}
  S.worlds.forEach(x=>{if(!seen.has(x.id)) walk(x,0,null,'',0);});
  return '<div class="muted" style="margin-bottom:6px">같은 상위 세계관 아래의 세계관끼리 ▲▼로 순서를 바꿔요</div>'+h;
}

function tabRel(c){

  const row=(x,type,auto,idx)=>'<div class="item"><div class="row"><span class="tag">'+type+(auto?' (자동)':'')+'</span><span class="grow">'+esc(x.name)+' <span class="muted">'+esc(KIND[x.kind])+(x.version?' · '+esc(x.version):'')+'</span></span>'+
    '<button type="button" data-act="open" data-i="'+x.id+'">열기</button>'+(auto?'':'<button type="button" data-act="delRel" data-i="'+idx+'">해제</button>')+'</div></div>';
  return (stored.length||derived.length?stored.map(r=>row(WORLD(r.id),r.type,false,c.related.indexOf(r))).join('')+derived.map(x=>row(x,'파생',true)).join(''):'<div class="muted">등록한 관련 세계관이 없어요</div>')+

    (c.kind==='root'?'<div class="muted" style="margin-top:4px">최상위 세계관에는 상위 세계관을 등록할 수 없어요.</div>':'')+'</div>';

function tabWorks(c){

APPS.world={title:'세계관',w:680,h:520,
  render(b,w){
    const ui=w.ui,c=curWorld(w);
    ui.tab=ui.tab||'info';
    let h='<div class="crumb">'+
      (ui.stack&&ui.stack.length?'<button type="button" data-act="back">← 뒤로</button>':'')+
      (c.kind!=='root'?'<button type="button" data-act="goRoot">최상위로</button>':'')+
      '<b style="flex:1;min-width:0">'+esc(c.name)+'</b>'+
      '<span class="tag">'+KIND[c.kind]+(c.version?' · '+esc(c.version):'')+'</span>'+
      '<button type="button" data-act="toggleList">'+(ui.listing?'세계관 목록 닫기':'세계관 목록')+'</button>'+
      '<button type="button" data-act="addForm">새 세계관</button>'+
      (c.kind!=='root'?'<button type="button" data-act="delWorld">삭제</button>':'')+'</div>';
    if(ui.adding){
      h+='<div class="panel"><h3>새 세계관 만들기</h3>'+
        fieldRow('이름','<input type="text" id="nw-n" placeholder="세계관 이름">','nw-n')+
        fieldRow('종류','<select id="nw-k"><option value="continuous">연속성 세계관</option><option value="oneshot">단발성 세계관</option></select>','nw-k')+
        fieldRow('상위 세계관','<select id="nw-p">'+opt(worldItems(),c.id)+'</select>','nw-p')+
        '<div class="row"><button type="button" data-act="createWorld">만들기</button><button type="button" data-act="cancelAdd">취소</button></div></div>';
    }
    if(ui.listing){h+=worldTree(c);b.innerHTML=h;return;}
    h+='<div class="tabs">'+WTABS.map(t=>'<button type="button" data-act="tab" data-v="'+t[0]+'" class="'+(ui.tab===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</div>';
    const fn={info:tabInfo,concepts:tabConcepts,time:tabTime,eps:tabEps,chars:tabChars,rel:tabRel,works:tabWorks,memo:tabMemo}[ui.tab];
    h+=fn(c,ui);
    b.innerHTML=h;
  },
  change(t,w){
    const ui=w.ui,c=curWorld(w),f=t.dataset.f; if(!f) return;
    if(f==='__cq'){ui.cq=t.value;rerender('world');return;}
    if(f==='__tl'){ui.tl=t.value;rerender('world');return;}
    if(f==='__charFields'){c.charFields=splitList(t.value);save();refreshWin('chars');return;}
    if(f.startsWith('__fd_')){c.filterDefs[f.slice(5)]=splitList(t.value);save();refreshWin('chars');return;}
    if(f==='__work'){
      const i=c.workIds.indexOf(t.dataset.i);
      if(t.checked&&i<0) c.workIds.push(t.dataset.i); else if(!t.checked&&i>=0) c.workIds.splice(i,1);
      save();refreshWin('works');return;
    }
    let target=c;
    if(t.dataset.l){
      let list=c[t.dataset.l];
      if(t.dataset.tl){const tl=c.timelines.find(x=>x.id===t.dataset.tl); list=tl?tl.events:[];}
      target=list.find(x=>x.id===t.dataset.i);
      if(!target) return;
    }
    target[f]=t.value; save();
    if(t.tagName==='SELECT'||f==='name'||f==='version') rerender('world');
    if(f==='name'||f==='version'){refreshWin('chars');refreshWin('works');}
  },
  click(a,t,w){
    const ui=w.ui,c=curWorld(w),i=t.dataset.i;
    if(!['toggleList','mvWorld'].includes(a)) ui.listing=false;
    const go=id=>{(ui.stack=ui.stack||[]).push(c.id);ui.cur=id;ui.tab='info';ui.ep=null;ui.tl=null;ui.cq='';};
    if(a==='toggleList'){ui.listing=!ui.listing;}
    else if(a==='mvWorld'){
      const par=WORLD(t.dataset.p),grp=par?kidsOf(par):orphanTops();
      const k=grp.findIndex(x=>x.id===i),o=grp[k+(+t.dataset.d)];
      if(k>=0&&o) swapIn(S.worlds,grp[k],o);
      save(); refreshWin('chars'); refreshWin('works'); rerender('world'); return;
    }
    else if(a==='back'){ui.cur=ui.stack.pop();ui.tab='info';ui.ep=null;ui.tl=null;}
    else if(a==='goRoot'){ui.stack=[];ui.cur=S.worlds.find(x=>x.kind==='root').id;ui.tab='info';ui.ep=null;ui.tl=null;}
    else if(a==='open'){ if(WORLD(i)) go(i); }
    else if(a==='addForm'){ui.adding=true;}
    else if(a==='cancelAdd'){ui.adding=false;}
    else if(a==='createWorld'){
      const n=$('#nw-n',w.body).value.trim()||'새 세계관';
      const nw=blankWorld($('#nw-k',w.body).value,n);
      const p=$('#nw-p',w.body).value;
      if(p) nw.related.push({id:p,type:'상위'});
      S.worlds.push(nw); ui.adding=false; save(); go(nw.id);
    }
    else if(a==='delWorld'){
      const back=ui.stack&&ui.stack.length?ui.stack.pop():S.worlds.find(x=>x.kind==='root').id;
      S.worlds=S.worlds.filter(x=>x.id!==c.id);
      trashIt('world',c.name,c); ui.cur=back; ui.tab='info'; save(); refreshAll(); return;
    }
    else if(a==='tab'){ui.tab=t.dataset.v;ui.ep=null;}
    else if(a==='addConcept'){c.concepts.push({id:uid(),title:'',body:''});ui.cq='';}
    else if(a==='delConcept'){
      const k=c.concepts.findIndex(x=>x.id===i); if(k>=0){const x=c.concepts.splice(k,1)[0];trashIt('sub',x.title||'개념',x,{wid:c.id,key:'concepts'});}
    }
    else if(a==='addTl'){const n={id:uid(),name:'새 시간선',forkOf:'',forkAt:'',events:[]};c.timelines.push(n);ui.tl=n.id;}
    else if(a==='delTl'){
      const k=c.timelines.findIndex(x=>x.id===ui.tl);
      if(k>=0&&c.timelines.length>1){
        const x=c.timelines.splice(k,1)[0];
        c.timelines.forEach(o=>{if(o.forkOf===x.id){o.forkOf='';o.forkAt='';}});
        trashIt('sub',x.name,x,{wid:c.id,key:'timelines'}); ui.tl=null;
      }
    }
    else if(a==='addEvent'){const tl=c.timelines.find(x=>x.id===ui.tl);if(tl) tl.events.push({id:uid(),date:'',title:'',body:''});}
    else if(a==='delEvent'){
      const tl=c.timelines.find(x=>x.id===ui.tl); if(!tl) return;
      const k=tl.events.findIndex(x=>x.id===i);
      if(k>=0){const x=tl.events.splice(k,1)[0];c.episodes.forEach(p=>{if(p.eventId===x.id)p.eventId='';});trashIt('sub',x.title||x.date||'사건',x,{wid:c.id,key:'events',tlid:tl.id});}
    }
    else if(a==='fork'){
      const tl=c.timelines.find(x=>x.id===ui.tl); if(!tl) return;
      const n={id:uid(),name:tl.name+' 분기',forkOf:tl.id,forkAt:i,events:[]};
      c.timelines.push(n); ui.tl=n.id;
    }
    else if(a==='addEp'){const p={id:uid(),title:'',eventId:'',body:''};c.episodes.push(p);ui.ep=p.id;}
    else if(a==='openEp'){ui.ep=i;}
    else if(a==='closeEp'){ui.ep=null;}
    else if(a==='delEp'){
      const k=c.episodes.findIndex(x=>x.id===i);
      if(k>=0){const x=c.episodes.splice(k,1)[0];trashIt('sub',x.title||'에피소드',x,{wid:c.id,key:'episodes'});}
      ui.ep=null;
    }
    else if(a==='tpl'){
      const p=c.episodes.find(x=>x.id===ui.ep),ta=$('#ep-b',w.body); if(!p||!ta) return;
      p.body=ta.value+(ta.value&&!ta.value.endsWith('\n')?'\n':'')+({scene:'# 장면: \n',action:'(지문) \n',line:'이름: \n'}[t.dataset.v]);
      save(); rerender('world'); const n=$('#ep-b',w.body); if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}
      return;
    }
    else if(a==='addRel'){
      const id=$('#rl-w',w.body).value,type=$('#rl-t',w.body).value; if(!id) return;
      if(!c.related.some(r=>r.id===id&&r.type===type)) c.related.push({id:id,type:type});
    }
    else if(a==='delRel'){c.related.splice(+i,1);}
    else if(a==='quickWork'){
      const v=($('#qw',w.body).value||'').trim(); if(!v) return;
      const k={id:uid(),title:v,link:'',desc:'',thumb:'',charIds:[],prompt:'',memo:''}; S.works.push(k); c.workIds.push(k.id); refreshWin('works');
    }
    else if(a==='newCharHere'){
      const ch=newChar(c.id); S.chars.push(ch); save();
      openApp('chars'); wins.chars.ui.open=ch.id; wins.chars.ui.ver=ch.versions[0].id; rerender('chars'); refreshWin('world'); return;
    }
    else if(a==='openChar'){
      openApp('chars'); wins.chars.ui.open=i; const ch=S.chars.find(x=>x.id===i); if(ch) wins.chars.ui.ver=ch.versions[0].id; rerender('chars'); return;
    }
    save(); rerender('world');
  }
};

/* ---------- 캐릭터 ---------- */
function newVer(label){
  return {id:uid(),label:label||'기본',d:{name:'새 캐릭터',gender:'',height:'',birthday:'',affiliation:'',category:'',sub:{},
    personality:'',setting:'',prompts:[],episodeIds:[],workIds:[],relations:[],memo:''}};
}
function newChar(worldId){return {id:uid(),worldId:worldId,versions:[newVer('기본')]};}
function charName(ch){return (ch.versions[0]&&ch.versions[0].d.name)||'(이름 없음)';}
function charWorks(ch){const s=new Set();ch.versions.forEach(v=>v.d.workIds.forEach(x=>s.add(x)));return s;}
function defsFor(worldId,key){
  if(worldId){const w=WORLD(worldId);return w?w.filterDefs[key]:[];}
  const s=[];S.worlds.forEach(w=>w.filterDefs[key].forEach(x=>{if(!s.includes(x))s.push(x);}));return s;
}
function withCur(list,cur){return cur&&!list.includes(cur)?list.concat([cur]):list;}

function charList(ui){
  const mode=ui.mode||'all';
  let list=S.chars.slice();
  if(mode==='world'&&ui.fWorld) list=list.filter(c=>c.worldId===ui.fWorld);
  if(mode==='work'&&ui.fWork) list=list.filter(c=>charWorks(c).has(ui.fWork));
  const wid=mode==='world'?ui.fWorld:'';
  const f=(key,field)=>{ if(ui[key]) list=list.filter(c=>c.versions.some(v=>v.d[field]===ui[key])); };
  f('fG','gender');f('fA','affiliation');f('fC','category');
  const sub=['gender','affiliation','category'].map(k=>defsFor(wid,k));
  return {list:sortedBy(list,S.settings.sortChars||'manual',charName),sub:sub};
}
function charListView(ui){
  const mode=ui.mode||'all',r=charList(ui);
  let h='<div class="tabs">'+[['all','전체'],['world','캐릭터 세계관'],['work','등장 작품']].map(m=>
    '<button type="button" data-act="mode" data-v="'+m[0]+'" class="'+(mode===m[0]?'on':'')+'">'+m[1]+'</button>').join('')+'</div>';
  h+='<div class="row" style="margin-bottom:8px">';
  if(mode==='world') h+='<select id="cf-w" aria-label="세계관" data-s="__fWorld">'+opt(S.worlds.map(w=>[w.id,w.name+(w.version?' ('+w.version+')':'')]),ui.fWorld,'세계관 전체')+'</select>';
  if(mode==='work') h+='<select id="cf-k" aria-label="작품" data-s="__fWork">'+opt(S.works.map(k=>[k.id,k.title]),ui.fWork,'작품 전체')+'</select>';
  h+='<select aria-label="성별" data-s="__fG">'+opt(r.sub[0].map(x=>[x,x]),ui.fG,'성별 전체')+'</select>'+
     '<select aria-label="소속" data-s="__fA">'+opt(r.sub[1].map(x=>[x,x]),ui.fA,'소속 전체')+'</select>'+
     '<select aria-label="분류" data-s="__fC">'+opt(r.sub[2].map(x=>[x,x]),ui.fC,'분류 전체')+'</select>'+
     sortSel('sortChars',S.settings.sortChars||'manual')+
     ((S.settings.sortChars||'manual')==='manual'?'<button type="button" data-act="toggleOrder">'+(ui.order?'순서 편집 끝':'순서 편집')+'</button>':'')+
     '<span style="flex:1"></span><button type="button" data-act="newChar">새 캐릭터</button></div>';
  h+=r.list.length?'<div class="grid cards">'+r.list.map((c,idx)=>'<div class="cw"><button type="button" class="card" data-act="openChar" data-i="'+c.id+'"><div class="pic">'+(c.versions[0].d.imgMain?imgTag(c.versions[0].d.imgMain):'대표 이미지')+'</div><div class="nm">'+esc(charName(c))+'</div></button>'+(ui.order&&(S.settings.sortChars||'manual')==='manual'?mvBtns('mvChar',c.id,idx,r.list.length):'')+'</div>').join('')+'</div>':

function workThumb(k){
  return k.thumb?imgTag(k.thumb):'썸네일';
}
function resizeThumb(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const W=240,H=360,c=document.createElement('canvas');c.width=W;c.height=H;
      const r=Math.max(W/im.width,H/im.height),sw=W/r,sh=H/r;
      c.getContext('2d').drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,W,H);
      cb(c.toDataURL('image/jpeg',0.82));
    };
    im.onerror=()=>cb('');
    im.src=fr.result;
  };
  fr.onerror=()=>cb('');
  fr.readAsDataURL(file);
}
function safeUrl(u){return /^https?:\/\//i.test(u||'')?u:'';}

    const board=S.memos.items.filter(m=>m.mode==='board');
    const byId={};board.forEach(m=>byId[m.id]=m);
    const lines=S.memos.links.filter(l=>byId[l[0]]&&byId[l[1]]).map(l=>{
      const a=byId[l[0]],c=byId[l[1]];
      return '<line x1="'+(a.x+75)+'" y1="'+(a.y+50)+'" x2="'+(c.x+75)+'" y2="'+(c.y+50)+'" stroke="currentColor" stroke-width="1.5"/>';
    }).join('');
    let h='<div class="row" style="margin-bottom:8px"><button type="button" data-act="newSticky">새 스티커 (바탕화면)</button>'+
      '<button type="button" data-act="newNote">새 보관함 메모</button>'+
      '<input type="text" id="mq" class="grow" placeholder="보관함 검색" aria-label="보관함 검색" data-f="__q" value="'+esc(q)+'"></div>'+
      '<div class="muted" style="margin-bottom:4px">'+(ui.link?'연결할 두 번째 메모의 “연결” 버튼을 눌러요':'보관함: 메모를 끌어서 옮기고, “연결”로 서로 이어요')+'</div>'+
      '<div class="canvas" id="cv"><div class="inner"><svg width="1600" height="1200" style="color:var(--muted)">'+lines+'</svg>'+
      board.map(m=>'<div class="note'+(ui.link===m.id?' pick':'')+'" data-id="'+m.id+'" style="left:'+m.x+'px;top:'+m.y+'px;'+(memoMatch(m,q)?'':'opacity:.3')+'">'+
        '<div class="sh"><span><button type="button" data-act="link" data-i="'+m.id+'">연결</button> <button type="button" data-act="toDesk" data-i="'+m.id+'">붙이기</button></span>'+
        '<button type="button" data-act="delNote" data-i="'+m.id+'" aria-label="삭제">×</button></div>'+
        '<textarea aria-label="메모 내용" data-f="text" data-i="'+m.id+'">'+esc(m.text)+'</textarea></div>').join('')+
      '</div></div>';
    if(q){
      const res=S.memos.items.filter(m=>memoMatch(m,q));
      h+='<div class="panel" style="margin-top:8px"><h3>검색 결과 '+res.length+'개</h3>'+(res.length?res.map(m=>'<div class="item"><span class="tag">'+(m.mode==='desk'?'바탕화면':'보관함')+'</span>'+esc((m.text||'').slice(0,80)||'(빈 메모)')+'</div>').join(''):'<div class="muted">일치하는 메모가 없어요</div>')+'</div>';
    }
    b.innerHTML=h;
    const cv=$('#cv',b);
    cv.scrollLeft=ui.csx||0; cv.scrollTop=ui.csy||0;
    cv.addEventListener('scroll',()=>{ui.csx=cv.scrollLeft;ui.csy=cv.scrollTop;});
    $$('.note',cv).forEach(el=>{
      const m=byId[el.dataset.id];
      makeDrag($('.sh',el),el,{
        clamp:(x,y)=>[Math.min(Math.max(x,0),1450),Math.min(Math.max(y,0),1100)],
        end:(x,y)=>{m.x=x;m.y=y;save();rerender('memo');}
      });
    });
  },
  change(t,w){
    const f=t.dataset.f;
    if(f==='__q'){w.ui.q=t.value;rerender('memo');return;}
    const m=S.memos.items.find(x=>x.id===t.dataset.i); if(!m) return;
    m.text=t.value; save(); renderStickies();
  },
  key(e,w){ if(e.key==='Enter'&&e.target.id==='mq'){e.preventDefault();w.ui.q=e.target.value;rerender('memo');} },
  click(a,t,w){
    const ui=w.ui,i=t.dataset.i,cv=$('#cv',w.body);
    if(a==='newSticky'){
      const n=S.memos.items.filter(m=>m.mode==='desk').length;
      S.memos.items.push({id:uid(),text:'',mode:'desk',x:Math.min(300+n*24,Math.max(0,$('#desktop').clientWidth-190)),y:90+n*24});
      save(); renderStickies(); return;
    }
    if(a==='newNote'){
      S.memos.items.push({id:uid(),text:'',mode:'board',x:((cv?cv.scrollLeft:0)+30)|0,y:((cv?cv.scrollTop:0)+30)|0});
    }else if(a==='toDesk'){
      const m=S.memos.items.find(x=>x.id===i);
      if(m){m.mode='desk';m.x=Math.min(320,Math.max(0,$('#desktop').clientWidth-190));m.y=100;S.memos.links=S.memos.links.filter(l=>l[0]!==i&&l[1]!==i);}
      save(); renderStickies(); rerender('memo'); return;
    }else if(a==='delNote'){ deleteMemo(i); return; }
    else if(a==='link'){
      if(!ui.link) ui.link=i;
      else if(ui.link===i) ui.link=null;
      else{
        const a1=ui.link,k=S.memos.links.findIndex(l=>(l[0]===a1&&l[1]===i)||(l[0]===i&&l[1]===a1));
        if(k>=0) S.memos.links.splice(k,1); else S.memos.links.push([a1,i]);
        ui.link=null;
      }
    }
    save(); rerender('memo');
  }
};

/* ---------- 휴지통 ---------- */
const TKIND={world:'세계관',char:'캐릭터',work:'작품',memo:'메모',todo:'투두',sub:'세계관 항목'};
APPS.trash={title:'휴지통',w:520,h:420,
  render(b){
    const t=now();
    b.innerHTML='<div class="row" style="margin-bottom:8px"><span class="grow muted">삭제한 항목은 72시간 뒤에 사라져요 ('+S.trash.length+'개)</span>'+
      (S.trash.length?'<button type="button" data-act="empty">비우기</button>':'')+'</div>'+
      (S.trash.length?S.trash.map(x=>{
        const left=Math.max(0,Math.ceil((H72-(t-x.at))/3600000));
        return '<div class="item"><div class="row"><span class="tag">'+esc(TKIND[x.kind]||x.kind)+'</span><span class="grow">'+esc(x.label)+'</span>'+
          '<span class="muted">'+left+'시간 남음</span><button type="button" data-act="restore" data-i="'+x.id+'">복원</button><button type="button" data-act="kill" data-i="'+x.id+'">지금 삭제</button></div></div>';
      }).join(''):'<div class="muted">휴지통이 비어 있어요</div>');
  },
  click(a,t){
    const i=t.dataset.i;
    if(a==='restore'){restoreTrash(i);return;}
    if(a==='kill') S.trash=S.trash.filter(x=>x.id!==i);
    else if(a==='empty') S.trash=[];
    save(); rerender('trash');
  }
};

/* ---------- 시작 ---------- */
renderWidgets(); renderStickies(); tickClock();
setInterval(tickClock,15000);
setInterval(pomoTick,500);
purge(); setInterval(()=>{purge();refreshWin('trash');},60000);
initDb();
})();
</script>
